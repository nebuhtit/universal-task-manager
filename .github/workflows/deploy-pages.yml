name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build referenced workspace packages before the web typecheck consumes
      # their declaration files. The final build below still receives the
      # release commit metadata used by the deployed version label.
      - run: pnpm --filter @utm/core build && pnpm --filter @utm/sdk build
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build
        env:
          VITE_GITHUB_PAGES: 'true'
          # Make the exact source revision visible in the deployed login screen.
          VITE_COMMIT_SHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
